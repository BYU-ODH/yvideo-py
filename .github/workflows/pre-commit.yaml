name: Pre-commit

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm ci

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Install python dependencies
      run: uv sync

    - name: Run pre-commit
      run: uv run pre-commit run --all-files || true # remove '|| true' when ready to enable pre-commit again.
