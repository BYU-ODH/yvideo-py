name: Deploy

on:
  push:
    branches: [main, staging]

# The dev environment is not auto-deployed. Developers SSH into the
# server and run `deploy/deploy.sh` manually from whatever branch
# they choose.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Map branch to environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "env=prod"    >> "$GITHUB_OUTPUT" ;;
            staging) echo "env=staging" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Trigger deploy
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_ENV: ${{ steps.env.outputs.env }}
        run: |
          jq -n --arg secret "$DEPLOY_SECRET" --arg env "$DEPLOY_ENV" \
            '{secret: $secret, environment: $env}' |
          curl -sf --max-time 10 -X POST \
            -H "Content-Type: application/json" \
            -d @- \
            "$DEPLOY_URL"
