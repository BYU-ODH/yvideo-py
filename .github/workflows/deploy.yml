name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main, prod]

# The dev environment is not auto-deployed. Developers SSH into the
# server and run `deploy/deploy.sh` manually from whatever branch
# they choose.

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Map branch to environment
        id: env
        run: |
          case "${{ github.event.workflow_run.head_branch }}" in
            main) echo "env=staging" >> "$GITHUB_OUTPUT" ;;
            prod) echo "env=prod"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Trigger deploy
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_ENV: ${{ steps.env.outputs.env }}
        run: |
          jq -n --arg secret "$DEPLOY_SECRET" --arg env "$DEPLOY_ENV" \
            '{secret: $secret, environment: $env}' |
          curl -sf --max-time 10 -X POST \
            -H "Content-Type: application/json" \
            -d @- \
            "$DEPLOY_URL"
