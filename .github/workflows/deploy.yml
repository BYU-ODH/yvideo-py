name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main, prod]

# The dev environment is not auto-deployed. Developers SSH into the
# server and run `deploy/deploy.sh` manually from whatever branch
# they choose.

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Map branch to job
        id: job
        run: |
          case "${{ github.event.workflow_run.head_branch }}" in
            main) echo "job=staging" >> "$GITHUB_OUTPUT" ;;
            prod) echo "job=prod"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Trigger deploy
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_JOB: ${{ steps.job.outputs.job }}
        run: |
          jq -n --arg secret "$DEPLOY_SECRET" --arg job "$DEPLOY_JOB" \
            '{secret: $secret, job: $job}' |
          curl -sf --max-time 10 -X POST \
            -H "Content-Type: application/json" \
            -d @- \
            "$DEPLOY_URL"
