name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Temporary until the Dec 18 prod release, when the merge workflow's workflow_run trigger is removed.
  merge-into-prod-flag:
    name: "THIS WILL ALSO MERGE INTO `prod`!!!"
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # Fails once the workflow_run trigger is gone, as a reminder to delete this job.
    - name: Check that main still auto-merges into prod
      run: |
        grep -q '^  workflow_run:' .github/workflows/MERGE_main_INTO_prod.yaml
        echo "::warning::Once tests pass on main, merging this PR will also merge main into prod."

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install npm dependencies
      run: npm ci

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync

    - name: Run pre-commit
      run: uv run pre-commit run --all-files --show-diff-on-failure
      env:
        SKIP: no-commit-to-branch

  django-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Run Django tests
      run: uv run python manage.py test core ic

    # Plain pytest functions, which `manage.py test` doesn't collect.
    - name: Run URL-registry permission checks
      run: uv run pytest core/tests/test_view_permissions.py

  js-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Run JS unit tests
      run: node --test tests/js/*.test.js

  e2e:
    runs-on: ubuntu-latest
    env:
      SKIP_LIVE_YOUTUBE_TESTS: "1"
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync --dev

    - name: Install Playwright browser
      run: uv run python -m playwright install --with-deps chromium

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Run e2e tests
      run: uv run pytest tests/e2e --ignore=tests/e2e/test_a11y.py --browser chromium  # a11y tests run in their own job

  a11y:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install npm dependencies
      run: npm ci  # provides axe-core for the accessibility tests

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync --dev

    - name: Install Playwright browser
      run: uv run python -m playwright install --with-deps chromium

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Run accessibility tests
      run: uv run pytest tests/e2e/test_a11y.py --browser chromium
