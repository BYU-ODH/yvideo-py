name: Tests

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install npm dependencies
      run: npm ci

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

  django-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync

    # STORAGES["staticfiles"] is a ManifestStaticFilesStorage, which resolves {% static %} through
    # staticfiles.json and raises for anything missing from it. Tests that *render* a template -
    # the blur-position endpoints return rendered HTML - therefore need that manifest to exist, and
    # nothing else in this job creates it. Without this step every such test 500s in CI while
    # passing on any developer machine that has ever run collectstatic, which is exactly how this
    # went unnoticed.
    #
    # Kept as a real collectstatic rather than swapped for a lenient storage backend in test
    # settings: a template naming a static file that does not exist is a genuine bug, and this is
    # the only thing that catches it before deploy.
    - name: Collect static files
      run: uv run python manage.py collectstatic --noinput

    - name: Run Django tests
      run: uv run python manage.py test core

  js-tests:
    # Pure-arithmetic unit tests for core/static/js/video-geometry.js, which decides where every
    # blur annotation is drawn. Node's built-in runner, so no npm install is needed: the suite
    # imports only node:test, node:assert and the module under test.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    # Explicit file paths, not the `tests/js/` directory: Node 24 treats a bare positional argument
    # as a module to load rather than a directory to walk, so the directory form fails here with
    # MODULE_NOT_FOUND while still working on the Node 20/22 a developer may have locally. The shell
    # expands this glob, so it behaves the same on every version.
    - name: Run JS unit tests
      run: node --test tests/js/*.test.js

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync --dev

    - name: Install Playwright browser
      run: uv run python -m playwright install --with-deps chromium

    - name: Run e2e tests
      run: uv run pytest tests/e2e --ignore=tests/e2e/test_a11y.py --browser chromium  # a11y tests run in their own job

  a11y:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6  # python version taken from `.python-version` file in project root

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install npm dependencies
      run: npm ci  # provides axe-core for the accessibility tests

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Install python dependencies
      run: uv sync --dev

    - name: Install Playwright browser
      run: uv run python -m playwright install --with-deps chromium

    - name: Run accessibility tests
      run: uv run pytest tests/e2e/test_a11y.py --browser chromium
