# Example Apache configuration for a rootless Podman Quadlet deployment.
# Adapt paths, ServerName, and SSL settings to your environment.
# Required modules: mod_proxy, mod_proxy_http, mod_headers, mod_alias

<VirtualHost *:443>
    ServerName example.com

    # ... your SSL config here (SSLEngine, SSLCertificateFile, etc.) ...

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Serve static and media files directly from the per-instance checkout.
    # Apache must be able to traverse /srv/yvideo-dev/app/ and read these
    # directories even though the checkout is owned by the yvideo-dev user.
    Alias /static/ /srv/yvideo-dev/app/staticfiles/
    Alias /media/  /srv/yvideo-dev/app/media/

    <Directory /srv/yvideo-dev/app/staticfiles/>
        Require all granted
    </Directory>
    <Directory /srv/yvideo-dev/app/media/>
        Require all granted
    </Directory>

    # Do not proxy requests that Apache handles directly
    ProxyPass /static/ !
    ProxyPass /media/  !

    # Match the HOST_PORT value from /srv/yvideo/dev/.env.
    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/
</VirtualHost>
