# Example Apache configuration for yvideo reverse proxy.
# Adapt paths, ServerName, and SSL settings to your environment.
# Required modules: mod_proxy, mod_proxy_http, mod_headers, mod_alias

<VirtualHost *:443>
    ServerName example.com

    # ... your SSL config here (SSLEngine, SSLCertificateFile, etc.) ...

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Serve static and media files directly from the host filesystem
    Alias /static/ /srv/yvideo/dev/staticfiles/
    Alias /media/  /srv/yvideo/dev/media/

    <Directory /srv/yvideo/dev/staticfiles/>
        Require all granted
    </Directory>
    <Directory /srv/yvideo/dev/media/>
        Require all granted
    </Directory>

    # Do not proxy requests that Apache handles directly
    ProxyPass /static/ !
    ProxyPass /media/  !

    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/
</VirtualHost>
