# Copy this file to jobs.toml and customize.
#
# Each job defines a working directory and a shell command to run when
# POST /deploy is called with a matching "job" field and the correct secret.
# Commands run via `bash -c`, so shell syntax (pipes, &&, env vars) is allowed.

[jobs.staging]
working_dir = "/srv/yvideo/staging"
command = "bash deploy/deploy.sh"

[jobs.prod]
working_dir = "/srv/yvideo/prod"
command = "bash deploy/deploy.sh"
