{% extends "core/noncsrf_base.html" %}

{% load static %}

{% block extra_css %}
    {{ block.super }}
{% endblock %}
{% block extra_js %}
    {{ block.super }}
    <meta name="csrf-token" content="{{ csrf_token }}">
    <!-- HTMX CSRF Configuration -->
    <script>

        // Get CSRF token from cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Configure HTMX to include CSRF token in all requests
        document.addEventListener('DOMContentLoaded', function() {
            document.body.addEventListener('htmx:configRequest', function(event) {
                event.detail.headers['X-CSRFToken'] = getCookie('csrftoken');
            });
        });
    </script>
    <script>
        window.addEventListener("offline", () => {
            window.alert("The browser has lost connection to the internet. Check your internet connection before continuing.");
        });

        const serverPoll = window.setInterval(() => {
            fetch("{% url 'poll_connection' %}", { cache: "no-store", signal: AbortSignal.timeout(60000) })
                .then(response => { if (!response.ok) console.log("Connection check failed."); })
                .catch(() => {
                    window.clearInterval(serverPoll);
                    window.alert("Could not communicate with the server. Your latest changes may not have been saved. When you are sure your internet connection is intact, refresh the page before continuing.");
                });
        }, 10000);
    </script>
{% endblock %}
