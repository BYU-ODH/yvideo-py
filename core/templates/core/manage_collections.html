{% extends "base.html" %}

{% block title %}Manage Collections{% endblock %}

{% block content %}
    <div class="collections-page">
        <div class="collections-sidebar">
            <div class="collections-sidebar-heading">
                <button
                    id="collection-create"
                    class="collection-button"
                    onclick="collection_modal.showModal();">
                    <img src="/static/img/plus.svg" id="icon" class="icon"> Collection
                </button>

                {% include "partials/add_collection_modal.html" %}

                <h4 class="collection-username">
                    {{ user.netid }}'s Collections
                </h4>
            </div>
            <div id="sorted-collections" class="sorted-collections">
                {% include "partials/sorted_collections.html" %}
            </div>
        </div>
        <div id="collections-detail" class="collections-detail">
            <div class="no-collections">
                <p>There are no collections</p>
            </div>
        </div>
    </div>

<script>
    function closeAndResetModal() {
        const modal = document.getElementById("collection_modal");
        const form = document.getElementById("collection-form");
        const nameInput = form.querySelector('input[name="name"]');
        const errorLabels = form.querySelectorAll('.text-error');

        modal.close();
        errorLabels.forEach(label => label.remove());

        if (nameInput) {
            nameInput.value = '';
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.body.addEventListener("fail", () => {
            document.getElementById("collection_modal").showModal();
        });

        document.body.addEventListener("success", () => {
            closeAndResetModal();
        });
    });
</script>
{% endblock %}
