<div class="item-form">

    <h3>Edit {{ item_type_label }}</h3>

    <form hx-post="{% url update_url item_type instance.id %}"
          hx-target="[data-item-id='{{ instance.id }}']"
          hx-swap="outerHTML"
          {% if not can_edit %}disabled{% endif %}>

        <input type="hidden" name="content_id" value="{{ content.id }}">

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ instance.name }}" {% if not can_edit %}readonly{% endif %}>
        </div>

        <div class="form-group">
            <label for="start_time">Start Time (seconds):</label>
            <input type="number" id="start_time" name="start_time" value="{{ start_seconds }}" step="0.1" {% if not can_edit %}readonly{% endif %}>
        </div>

        {% if item_type != 'pause' %}
        <div class="form-group">
            <label for="end_time">End Time (seconds):</label>
            <input type="number" id="end_time" name="end_time" value="{{ end_seconds }}" step="0.1" {% if not can_edit %}readonly{% endif %}>
        </div>
        {% endif %}

        {% if item_type == 'pause' %}
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" {% if not can_edit %}readonly{% endif %}>{{ instance.message }}</textarea>
        </div>
        {% elif item_type == 'comment' %}
        <div class="form-group">
            <label for="text">Text:</label>
            <textarea id="text" name="text" {% if not can_edit %}readonly{% endif %}>{{ instance.text }}</textarea>
        </div>
        <div class="form-group">
            <label for="x">X Position:</label>
            <input type="number" id="x" name="x" value="{{ instance.x }}" step="0.1" {% if not can_edit %}readonly{% endif %}>
        </div>
        <div class="form-group">
            <label for="y">Y Position:</label>
            <input type="number" id="y" name="y" value="{{ instance.y }}" step="0.1" {% if not can_edit %}readonly{% endif %}>
        </div>
        {% elif item_type == 'blank' %}
        <div class="form-group">
            <label for="blank_type">Blank Type:</label>
            <select id="blank_type" name="blank_type" {% if not can_edit %}disabled{% endif %}>
                <option value="k" {% if instance.type == 'k' %}selected{% endif %}>Black</option>
                <option value="#" {% if instance.type == '#' %}selected{% endif %}>Blur</option>
                <option value="w" {% if instance.type == 'w' %}selected{% endif %}>White</option>
            </select>
        </div>
        {% elif item_type == 'censor' %}
        <div class="form-group">
            <label for="positions">Positions (JSON):</label>
            <textarea id="positions" name="positions" {% if not can_edit %}readonly{% endif %}>{{ instance.positions|safe }}</textarea>
            <p class="help-text">Position data managed via drag interface</p>
        </div>
        {% endif %}

        {% if can_edit %}
        <div class="form-actions">
            <button type="submit" class="btn-primary">Update</button>
            <button type="button"
                    hx-delete="{% url delete_url item_type instance.id %}?content_id={{ content.id }}"
                    hx-target="[data-item-id='{{ instance.id }}']"
                    hx-swap="delete"
                    class="btn-danger">
                Delete
            </button>

            <!-- Per-item undo/redo controls -->
            <div class="undo-redo-controls">
                <button type="button"
                        hx-post="{% url 'undo_annotation' content.id %}"
                        hx-vals='{"annotation_id": "{{ instance.id }}", "annotation_type": "{{ item_type }}"}'
                        hx-target="#annotation-timeline"
                        hx-swap="innerHTML"
                        {% if not instance.prev %}disabled{% endif %}
                        class="btn-secondary"
                        title="Undo last change (Ctrl+Z)">
                    ← Undo
                </button>
                <button type="button"
                        hx-post="{% url 'redo_annotation' content.id %}"
                        hx-vals='{"annotation_id": "{{ instance.id }}", "annotation_type": "{{ item_type }}"}'
                        hx-target="#annotation-timeline"
                        hx-swap="innerHTML"
                        {% if not instance.next %}disabled{% endif %}
                        class="btn-secondary"
                        title="Redo (Ctrl+Shift+Z)">
                    Redo →
                </button>
            </div>
        </div>
        {% endif %}
    </form>
</div>
