{% load static %}

<div id="subtitle-editor-panel"
     class="subtitle-editor-panel-hidden editor-container-component-dark editor-panel-wrapper">
    <div id="subtitle-panel-header" class="row-flex flex-apart-aligned">
        <h3 id="subtitle-panel-title">Subtitle Editor</h3>
        <div id="subtitle-track-settings-menu-wrapper"
             class="multi-option-menu-wrapper">
            <button id="subtitle-track-menu-button"
                    type="button"
                    class="open-multi-option-menu"
                    aria-label="Subtitle track settings">
                <img src="{% static 'img/dots_menu_white.svg' %}" alt="">
            </button>
            <div id="subtitle-track-settings-menu" class="multi-option-menu">
                <button id="open-subtitle-track-options-modal"
                        type="button"
                        class="multi-option-menu-button"
                        command="show-modal"
                        commandfor="change-subtitle-track-modal">Change track to edit</button>
            </div>
        </div>
        {% include 'core/partials/modals/subtitle_track_options.html' %}
    </div>
    {% include 'core/partials/subtitle_panel_content.html' %}

    <button id="subtitle-panel-switch"
            class="white-button-with-border editor-panel-switch">Switch to Annotation Editor</button>
</div>
