{% load static %}

<div class="semester-course"
     data-assigned-course-id="{{ course.id }}"
     data-dept="{{ course.dept }}"
     data-catalog-number="{{ course.catalog_number }}">
    <div>
        <p>{{ course.dept }}</p>
        <p>{{ course.catalog_number }}</p>
    </div>
    <div>
        <p class="course-sections">{{ course.section_list }}</p>
        <button type="button"
                class="edit-course-button"
                aria-label="Edit {{ course.dept }} {{ course.catalog_number }} and sections"
                data-edit-url="{% url 'edit_playlist_courses_form' playlist.id %}"
                command="show-modal"
                commandfor="edit-assigned-course">
            <img src="{% static 'img/edit.svg' %}" alt="E">
        </button>
    </div>
    <button class="assigned-course-delete" command="show-modal" commandfor="delete-assigned-course-modal">
        <img src="{% static 'img/trash.svg' %}">
    </button>
</div>
