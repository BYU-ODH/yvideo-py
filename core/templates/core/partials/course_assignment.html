{% load static %}
<div id="assigned-courses-list">
    {% for assigned_course in assigned_courses %}
    <div class="assigned-course row-flex">
        <p>{{ assigned_course.title }}</p>
        <input type="text" value="{{ assigned_course.section_list }}"
    </div>
    {% empty %}
    <p>No assigned courses</p>
    {% endfor %}
</div>
<div id="assign-course-wrapper" class="column-flex">
    <h4>Add Course</h4>
    <div class="row-flex">
        <div class="column-flex-no-gap">
            <label for="department">Department</label>
            <input id="department" type="text">
        </div>
        <div class="column-flex-no-gap">
            <label for="catalog-number">Catalog number</label>
            <input id="catalog-number" type="text">
        </div>
    </div>
    <button id="assign-course-button" class="blue-button position-flex-start">+ Assign Course</button>
</div>

<script type="module" src="{% static 'js/courseAssignment.js' %}"></script>
