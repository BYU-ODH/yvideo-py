{% load static %}

<dialog id="annotation-set-retirement-modal">
    <div id="annotation-set-settings-compact"
         class="column-flex"
         data-annotation-set-id="{{ annotation_set.id }}"
         data-annotation-set-name="{{ annotation_set.name }}">
        <button class="close-dialog-button"
                command="close"
                commandfor="annotation-set-retirement-modal"
                aria-label="Close annotation set retirement modal">X</button>
        <h2>Retire Annotation set</h2>
        <div class="column-flex">
            <p class="annotation-set-editors-note">
                Retiring "{{ annotation_set.name }}" keeps the set readable and
                copyable for anyone already using it, but nobody will be able to
                change it again.
            </p>
            <div>
                <button id="annotation-set-retire"
                        class="red-button"
                        aria-label="Retire the {{ annotation_set.name }} annotation set">Retire this set</button>
                <button type="button"
                        class="cancel-button"
                        command="close"
                        commandfor="annotation-set-retirement-modal"
                        aria-label="Cancel annotation set retirement">Cancel</button>
            </div>
        </div>
    </div>
</dialog>
