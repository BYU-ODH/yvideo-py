<div class="resource-intake-choice-set"
     role="group"
     aria-label="Legal compliance">
    <div class="resource-intake-choice-group{% if form.acknowledged_compliance.errors %} resource-intake-field-error{% endif %}">
        {{ form.acknowledged_compliance }}
        <label class="resource-intake-policy-compliance-label"
               for="{{ form.acknowledged_compliance.id_for_label }}">
            <span class="resource-intake-required-marker">*</span> I have
            read the <a target="_blank"
    href="https://policy.byu.edu/view/guidelines-for-selecting-and-teaching-literary-and-visual-materials-at-byu-policy">BYU Visual Teaching Materials Policy</a>
            and <a target="_blank" href="https://policy.byu.edu/view/copyright-policy">BYU Copyright Policy</a>
            and will use this resource in compliance with them.
        </label>
    </div>
    <div class="resource-intake-choice-group{% if form.acknowledged_fair_use_limitation.errors %} resource-intake-field-error{% endif %}">
        {{ form.acknowledged_fair_use_limitation }}
        <label for="{{ form.acknowledged_fair_use_limitation.id_for_label }}">
            <span class="resource-intake-required-marker">*</span> I will
            only share this resource with students enrolled in relevant
            courses, or other uses permitted by
            <a target="_blank"
               href="https://www.copyright.gov/help/faq/faq-fairuse.html">Fair Use</a>.
            (See <a href="https://files.lib.byu.edu/copyright/Checklist_for_Fair_Use.pdf">BYU's Fair Use checklist</a>.)
            Note that Fair Use arguments are weaker for films that can
            be streamed on commercial services, e.g. Amazon Prime,
            Disney+, Hulu, Netflix, Paramount+, etc.
        </label>
    </div>
</div>
