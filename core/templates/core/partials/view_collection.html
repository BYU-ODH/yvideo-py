{% if collection %}
    <div class="title-section">
        <h2 class="collection-title">{{ collection.name }}</h2>
    </div>
    <div class="collection-content">
        {% for content in contents %}
            {% include "partials/content_header.html" %}
        {% empty %}
            <p>No content in this collection yet.</p>
        {% endfor %}
    </div>
{% else %}
    <div id="no-collections-body" class="no-collections">Select a Collection to get started.</div>
{% endif %}
