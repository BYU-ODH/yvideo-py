{% load static %}

<div class="annotation-set-selector-row" style="display: flex; align-items: center; gap: 0.5rem;">
    <div id="annotation-set-select-form">
        <select id="annotation-set-selector" name="annotation_set_id" {% if not can_edit %}disabled{% endif %}>
            <option value="">-- Select Annotation Set --</option>
            {% for set in available_annotation_sets %}
                <option value="{{ set.id }}"
                        {% if annotation_set and set.id == annotation_set.id %}selected{% endif %}>
                    {{ set.name }} ({{ set.owner.get_full_name }})
                </option>
            {% endfor %}
        </select>
    </div>
    {% if can_edit_annotation_set %}
        <button id="annotation-set-settings-btn"
                type="button"
                title="Edit Annotation Set"
                hx-get="{% url 'load_annotation_set_settings' annotation_set.id %}?content_id={{ content.id }}"
                hx-target="#annotation-set-settings-panel"
                hx-swap="innerHTML"
                style="background: none; border: none; cursor: pointer; padding: 0;">
            <img src="{% static 'img/settings.svg' %}" alt="Settings" style="width: 20px; height: 20px; vertical-align: middle;">
        </button>
    {% endif %}
</div>
<div id="annotation-set-settings-panel" style="margin-bottom: 1rem;"></div>
