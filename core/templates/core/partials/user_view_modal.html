{% load static %}

<dialog id="{{ dialog_id }}"
        class="user-view-modal"
        aria-labelledby="{{ dialog_id }}-title">
    <header class="user-view-modal-header">
        <div class="user-view-modal-header-start">
            {% if previous_dialog_id %}
                <button type="button"
                        class="cancel-button"
                        data-previous-dialog-id="{{ previous_dialog_id }}">Back</button>
            {% endif %}
        </div>
        <h3 id="{{ dialog_id }}-title">
            {% block modal_title %}{% endblock %}
        </h3>
        <div class="user-view-modal-header-end">
            <button type="button"
                    class="close-modal"
                    command="close"
                    commandfor="{{ dialog_id }}"
                    aria-label="Close"
                    title="Close">
                <img src="{% static 'img/black-x.svg' %}" alt="x">
            </button>
        </div>
    </header>
    {# The separating space lives outside the block so a formatter cannot strip it and glue class names together. #}
    <div class="user-view-modal-body {% block modal_body_classes %}{% endblock %}">
        {% block modal_body %}{% endblock %}
    </div>
</dialog>
