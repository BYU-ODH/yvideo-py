{% load static %}

<div id="annotation-player-container" data-contentid="{{content_id}}" class="annotation-player-container">
    <video id="video-player" preload="auto">
        {% if resource_file_key_id %}
            <source src="{% url 'stream_file' resource_file_key_id %}" type="video/mp4">
        {% endif %}
        Your browser does not support the video tag.
    </video>
</div>

<script type="module" src="{% static 'js/player-wrapper.js' %}"></script>
