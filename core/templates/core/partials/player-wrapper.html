{% load static %}

<script>
    window.playerData = {
        events: {{ events|safe }},
        subtitles: {{ subtitles|safe }},
        clips: {{ clips|safe }},
        hasSubtitles: {{ has_subtitles|yesno:"true,false" }}
    };
</script>

<div class="annotation-player-container">
    <video id="video-player" preload="auto">
        {% if file_key %}
            <source src="{% url 'stream_file' file_key %}" type="video/mp4">
        {% endif %}
        Your browser does not support the video tag.
    </video>
</div>

<script type="module" src="{% static 'js/player-wrapper.js' %}"></script>
