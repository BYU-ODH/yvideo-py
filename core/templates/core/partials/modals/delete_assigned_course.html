{% extends "core/partials/modals/user_view_modal.html" %}

{% block modal_classes %}playlist-editing-modal{% endblock %}
{% block modal_title %}Unassign course{% endblock %}
{% block modal_body %}
    <p id="unassign-course-description">Remove this course and its sections from the playlist?</p>
    <div class="row-flex flex-apart-aligned">
        <button id="unassign-course-confirm"
                type="button"
                class="red-button"
                data-unassign-url="{% url 'unassign_playlist_from_course' playlist.id %}"
                disabled>Unassign course</button>
        <button type="button"
                class="cancel-button"
                command="close"
                commandfor="{{ dialog_id }}">Cancel</button>
    </div>
{% endblock %}
