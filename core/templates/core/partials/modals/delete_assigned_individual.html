{% extends "core/partials/modals/user_view_modal.html" %}

{% block modal_classes %}playlist-editing-modal{% endblock %}
{% block modal_title %}Remove individual from playlist{% endblock %}
{% block modal_body %}
    <p id="unassign-individual-description">Remove this individual's direct access to the playlist?</p>
    <div class="row-flex flex-apart-aligned">
        <button id="unassign-individual-confirm" type="button" class="red-button" disabled>Remove</button>
        <button type="button"
                class="cancel-button"
                command="close"
                commandfor="{{ dialog_id }}">Cancel</button>
    </div>
{% endblock %}
