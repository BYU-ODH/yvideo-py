{% extends "core/partials/modals/user_view_modal.html" %}

{% block modal_title %}Delete subtitle track{% endblock %}
{% block modal_body %}
    <p>Delete the "<span id="delete-subtitle-track-text"></span>" subtitle track?</p>
    <div class="row-flex flex-apart-aligned">
        <button id="delete-subtitle-track-confirm" type="button" class="red-button">Delete subtitle track</button>
        <button type="button"
                class="cancel-button"
                command="close"
                commandfor="{{ dialog_id }}">Cancel</button>
    </div>
{% endblock %}
