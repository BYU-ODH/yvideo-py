{% load static %}
<div id="important-word-{{word.id}}" class="important-word-display">
    <p>{{word.word}} - {{word.translation}}</p>
    <img src="{% static 'img/delete.svg' %}"
        hx-delete="{% url 'delete_important_word' word.id %}"
        hx-trigger="click"
        hx-target="#important-word-{{word.id}}"
        hx-swap="outerHTML"
        hx-vals="{'id': '{{word.id}}'}"
        hx-headers="js:{'x-csrftoken': document.querySelector('[name=csrfmiddlewaretoken]').value}"
    />
</div>
