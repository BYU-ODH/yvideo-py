<div id="assigned-individuals-list" data-playlist-membership-list>
    {% if individual_accesses %}
        <div class="playlist-category-header">
            <p>Name</p>
        </div>
    {% endif %}
    {% for access in individual_accesses %}
        <div class="assigned-individual row-flex flex-apart-aligned">
            <p>{{ access.user.netid|default:access.user.username }} - {{ access.user.get_full_name|default:access.user.username }}</p>
            <div class="row-flex flex-apart-aligned">
                <button type="button"
                        class="assigned-individual-delete white-button-with-border"
                        aria-label="Remove {{ access.user.get_full_name|default:access.user.username }} from playlist access"
                        data-remove-url="{% url 'remove_playlist_member' playlist.id access.user_id %}"
                        data-individual-name="{{ access.user.get_full_name|default:access.user.username }}"
                        command="show-modal"
                        commandfor="delete-assigned-individual-modal">Remove</button>
            </div>
        </div>
    {% empty %}
        <p>No individuals assigned.</p>
    {% endfor %}
</div>
