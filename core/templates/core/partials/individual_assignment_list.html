{% load static %}

<div id="assigned-individuals-list">
    {% for access in individual_accesses %}
        <div class="assigned-individual row-flex flex-apart-aligned">
            <p>{{ access.user.netid|default:access.user.username }} - {{ access.user.get_full_name|default:access.user.username }}</p>
            <div class="row-flex flex-apart-aligned">
                <p>{{ access.get_playlist_role_display }}</p>
                <button type="button"
                        class="assigned-individual-edit white-button-with-border"
                        aria-label="Edit role for {{ access.user.get_full_name|default:access.user.username }}"
                        data-edit-url="{% url 'update_playlist_member_role' playlist.id access.user_id %}"
                        command="show-modal"
                        commandfor="edit-assigned-individual-modal"
                        {% if not access.may_manage %}disabled{% endif %}>
                    <img src="{% static 'img/edit.svg' %}" alt="">
                </button>
                <button type="button"
                        class="assigned-individual-delete white-button-with-border"
                        aria-label="Remove {{ access.user.get_full_name|default:access.user.username }} from playlist access"
                        data-remove-url="{% url 'remove_playlist_member' playlist.id access.user_id %}"
                        data-individual-name="{{ access.user.get_full_name|default:access.user.username }}"
                        command="show-modal"
                        commandfor="delete-assigned-individual-modal"
                        {% if not access.may_manage %}disabled{% endif %}>
                    <img src="{% static 'img/trash.svg' %}" alt="">
                </button>
            </div>
        </div>
    {% endfor %}
</div>
