<div class="track-item elevated"
     id="{{ item_type }}-{{ instance.id }}"
     data-annotation-id="{{ instance.id }}"
     data-annotation-type="{{ item_type }}"
     data-start="{{ position.start }}"
     data-end="{{ position.end }}"
     data-label="{{ instance.name }}"
     data-delta-left="0"
     data-delta-width="0"
     tabindex="0"
     onmousedown="elevateFromSiblings(this)">

    <div class="resize-handle resize-handle-left">
         <div class="resize-handle-indicator indicator-left"></div>
     </div>

    <div class="track-item-content">
        <span class="track-item-label">{{ instance.name }}</span>
    </div>

    {% if item_type != "pause"%}
    <div class="resize-handle resize-handle-right">
          <div class="resize-handle-indicator indicator-right"></div>
     </div>
     {% endif %}

     <form id="item-form-{{ instance.id }}" style="display: none;">
          {% csrf_token %}
          <input type="hidden" name="name" value="{{ instance.name }}">
          <input type="hidden" name="start_time" value="{{ instance.start_time }}">
          <input type="hidden" name="end_time" value="{{ instance.end_time }}">
          <input type="hidden" name="description" value="{{ instance.description }}">
     </form>
</div>
