{% load static %}

<div id="subtitle-panel-content-wrapper"
     data-can-edit="{{ can_edit|yesno:'true,false' }}"
     data-language="{{ subtitle_track.language.bcp47 }}">
    {% if subtitle_track %}
        {% if can_edit %}
            <button id="add-new-subtitle-button" class="white-button-with-border">+ Add new subtitle at current time</button>
        {% else %}
            <p>If you need to change this subtitle track, contact the owner or Use Edit subtitle track to make a copy.</p>
        {% endif %}
        <div id="subtitle-panel-list">
            {% include 'core/partials/subtitle_cues.html' %}
        </div>
    {% endif %}
</div>
