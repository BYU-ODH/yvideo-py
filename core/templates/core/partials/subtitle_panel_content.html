<div id="subtitle-panel-content-wrapper">
    {% if subtitle_track %}
    <button id="add-new-subtitle-button" class="small-button">
        + Add new subtitle at current time
    <button>
    <div id="subtitle-panel-list">
        {% for cue in cues %}
        <div class="subtitle-cue">
            <p class="subtitle-cue-count">
                {{forloop.counter}}
            </p>
            <div class="subtitle-input-groups">
                <div class="subtitle-cue-input-group">
                    <label>
                        Start:
                    </label>
                    <input type="text" value={{cue.display_start_time}}>
                </div>
                <div class="subtitle-cue-input-group">
                    <label>
                        End:
                    </label>
                    <input type="text" value={{cue.display_end_time}}
                </div>
            </div>
            <p class="subtitle-cue-content">
                {{cue.payload}}
            </p>
            <button class="subtitle-cue-delete" data-subtitle-id="{{cue.id}}">
                <img src="/static/img/trash.svg">
            </button>
        </div>
        {% empty %}
        <p>
            There are no cues for this subtitle track
        </p>
        {% endfor %}
    </div>
    {% endif %}
</div>
