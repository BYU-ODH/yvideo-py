{% load static %}

<div id="annotation-set-settings-compact" class="column-flex" data-annotation-set-id="{{annotation_set.id}}" data-annotation-set-name="{{annotation_set.name}}">
    <h2>Annotation Set Settings</h2>
    <button class="red-button close-dialog-button" command="close" commandfor="annotation-set-settings">X</button>
    <div id="annotation-set-select-form" class="column-flex-no-gap">
        <label for="annotation-set-selector">Selected annotation set:</label>
        <select id="annotation-set-selector" class="position-flex-start" name="annotation_set_id" {% if not can_edit %}disabled{% endif %}>
            <option class="annotation-set-option" value="">-- Select Annotation Set --</option>
            {% for set in available_annotation_sets %}
                <option class="annotation-set-option" value="{{ set.id }}"
                        {% if annotation_set and set.id == annotation_set.id %}selected{% endif %}>
                    <span class="set-option-name">{{ set.name }}</span> <span class="set-option-owner">({{ set.owner.get_full_name }})</span>
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="column-flex">
        <h4>Update Annotation Set</h4>
        <div>
            <label for="annotation-set-name">Name:</label>
            <input type="text" id="annotation-set-name" name="name" value="{{ annotation_set.name }}" required>
        </div>
        <div>
            <button id="annotation-name-submit-button" type="submit" class="small-button">Save</button>
            <button type="button" class="cancel-button" command="close" commandfor="annotation-set-settings">Cancel</button>
        </div>
    </div>

    <div>
        <h4>Editors</h4>
        {% for editor in annotation_set.editors.all %}
            <div class="annotation-set-editor-details">
                <p>{{ editor.get_full_name }} ({{ editor.netid }})</p>
                {% if request.user == annotation_set.owner %}
                <button class="remove-editor-button" aria-label="Remove Editor" data-editor-id="{{editor.id}}">
                    <img src="{% static 'img/trash.svg' %}" alt="Remove Editor">
                </button>
                {% endif %}
            </div>
        {% endfor %}
    </div>

    <form hx-post="{% url 'add_editor_to_annotation_set' annotation_set.id %}"
          hx-target="#annotation-set-settings-compact"
          hx-swap="outerHTML"
          autocomplete="off"
          class="column-flex">
        <input type="hidden" name="content_id" value="{{ content.id }}">
        <div for="editor-search" class="row-flex-no-gap">
            <label for="editor-search">Search by user:</label>
            <input type="text" name="search" id="editor-search" hx-post="{% url 'spoof_user_search' %}" hx-trigger="keyup changed delay:300ms" hx-target="#editor-search-results" hx-swap="innerHTML">
        </div>
        <select name="username" id="editor-search-results" class="position-flex-start" size="4" aria-label="Select editors" required>
            <option disabled selected></option>
        </select>
        <button type="submit" class="small-button position-flex-start">Add Editor</button>
    </form>
</div>
