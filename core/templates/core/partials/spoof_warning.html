{% if request.is_spoofing %}
<div id="spoof-warning">
    <span class="spoof-warning-message">
        <span class="spoof-warning-message-content">
            <span class="spoof-warning-as">{{ request.original_user.username }} as</span>
            <span class="spoof-warning-target">
                {{ request.user.first_name }} {{ request.user.last_name }}
                <span class="spoof-warning-netid">({{ request.user.netid }})</span>
            </span>
        </span>
    </span>
    <form method="post" action="{% url 'stop_spoofing' %}" class="spoof-warning-stop-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="spoof-warning-stop">[Stop]</button>
    </form>
</div>
{% endif %}
