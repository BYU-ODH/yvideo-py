{% load static %}

<div id="player-container" class="player-container">
    <video id="main-video" preload="auto">
        {% if file_key %}
            <source src="{% url 'stream_file' file_key %}" type="video/mp4">
        {% endif %}
        Your browser does not support the video tag.
    </video>
</div>

<!-- Optional: Transcript Sidebar (Django-specific feature) -->
<div id="transcript-sidebar" class="transcript-sidebar hidden">
    <!-- Transcript content here -->
</div>

<script type="module" src="{% static 'js/video-and-controls.js' %}"></script>
