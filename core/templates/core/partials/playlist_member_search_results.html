{% for user in users %}
    <button type="submit" class="assignment-search-result" data-individual-user-id="{{ user.id }}">
        {{ user.get_full_name|default:user.username }} ({{ user.netid }})
    </button>
{% empty %}
    <p class="muted-text">{% if query_too_short %}Keep typing{% elif query %}No matches{% else %}Type to search{% endif %}</p>
{% endfor %}
