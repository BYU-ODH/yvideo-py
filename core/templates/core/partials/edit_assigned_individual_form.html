<form id="edit-individual-form"
      method="post"
      data-edit-individual-form
      action="{% url 'update_playlist_member_role' playlist.id individual_access.user_id %}">
    {% csrf_token %}
    <p>{{ individual_access.user.get_full_name|default:individual_access.user.username }} ({{ individual_access.user.netid }})</p>
    {{ edit_individual_form.non_field_errors }}
    <div class="playlist-field-wrapper">
        {{ edit_individual_form.role.label_tag }}
        {{ edit_individual_form.role }}
        {{ edit_individual_form.role.errors }}
    </div>
    <div class="row-flex flex-apart-aligned">
        <button type="submit" class="white-button-with-border">Save</button>
        <button type="button"
                class="cancel-button"
                command="close"
                commandfor="{{ dialog_id }}">Cancel</button>
    </div>
</form>
