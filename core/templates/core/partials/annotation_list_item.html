{% load static %}

<div id="{{ type }}-panel-item-{{ id }}"
     class="panel-item {{ type }}-list-item-wrapper row-flex flex-apart-aligned"
     data-annotation-type="{{ type }}"
     data-annotation-id="{{ id }}">
    <div class="panel-item-name">{{ name }}</div>
    <button class="annotation-item-delete item-form-icon-button"
            aria-label="Delete annotation">
        <img src="{% static 'img/trash.svg' %}" alt="delete" />
    </button>
</div>
