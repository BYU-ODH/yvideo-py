<form class="content-form"
    hx-trigger="submit"
    hx-put="{% url 'update_content' %}"
    hx-target="closest .content-display"
    hx-vals='{"content_id": "{{ content.pk }}"}'
    hx-swap="innerHTML">
    {% csrf_token %}

    {{ form.non_field_errors }}
    {{form.id}}
    <div class="content-form-top">
        <div class="content-form-left">
            <div class="content-form-group">
                {{form.title.as_field_group}}
            </div>
            <div class="content-form-group">
                {{form.published.as_field_group}}
            </div>
            <div class="content-form-group">
                {{form.allow_definitions.as_field_group}}
            </div>
            <div class="content-form-group">
                {{form.allow_notes.as_field_group}}
            </div>
            <div class="content-form-group">
                {{form.allow_captions.as_field_group}}
            </div>
        </div>
        <div class="content-form-right">
            {{form.description.as_field_group}}
        </div>
    </div>

    <input id="content-form-submit" class="small-button" type="submit">
</form>
