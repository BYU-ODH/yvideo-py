<div id="collection-settings">
    <div class="column-flex">
        <h3>Settings</h3>
        <form id="collection-settings-form" class="column-flex" method="post" action="/collection-settings/update/">
            {% csrf_token %}

            {{ form.non_field_errors }}
            {{ form.id }}
            <div class="collection-form-group">
                {{ form.name.as_field_group }}
            </div>
            <div class="collection-form-group">
                {{ form.published.as_field_group }}
            </div>
            <div class="collection-form-group">
                {{ form.archived.as_field_group }}
            </div>
            <div class="row-flex">
                <button id="collection-settings-submit" class="blue-button" type="submit">
                    Submit
                </button>
                <button id="collection-settings-reset" class="cancel-button">
                    Reset
                </button>
            </div>
        </form>
    </div>
    <dialog id="collection-delete-modal" class="user-view-modal">
        <h3 class="user-view-modal-header">
            Delete this collection?
        </h3>
        <div class="user-view-modal-body row-flex flex-apart-aligned">
            <button id="collection-confirm-delete" class="blue-button">
                Yes
            </button>
            <button class="cancel-button" command="close" commandfor="collection-delete-modal">
                No
            </button>
        </div>
    </dialog>
    <dialog id="collection-course-assignments-modal" class="user-view-modal">
        <h3 class="user-view-modal-header">
            Edit Course Assignments
        </h3>
        <div class="user-view-modal-body column-flex">
            <div class="row-flex">
                <div class="column-flex">
                    <label for="semester-select">Semester</label>
                    <select id="semester-select">
                        <option {% if semester == 5 %}selected{% endif %} value="5">Fall</option>
                        <option {% if semester == 1 %}selected{% endif %} value="1">Winter</option>
                        <option {% if semester == 3 %}selected{% endif %} value="3">Spring</option>
                        <option {% if semester == 4 %}selected{% endif %} value="4">Summer</option>
                    </select>
                </div>
                <div class="column-flex">
                    <label for="year-select">Year</label>
                    <select id="year-select">
                        {% for year_option in year_options %}
                            <option {% if year_option.current %}selected{% endif %} value="{{ year_option.value }}">{{ year_option.value }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div id="course-assignment-container">
                {% include 'partials/course_assignment.html' %}
            </div>
        </div>
    </dialog>
    <div class="column-flex flex-apart">
        <button id="collection-settings-delete" class="red-button" command="show-modal" commandfor="collection-delete-modal">
            Delete Collection
        </button>
        <button id="collection-edit-course-assignment-button" class="blue-button" command="show-modal" commandfor="collection-course-assignments-modal">
            Edit Course Assignments
        </button>
    </div>
</div>
