<div class="landing-page-collection-list column-flex">
    <header class="collections-header row-flex flex-apart-aligned">
        <h2>{{heading}}</h2>
        {% if heading == 'My Collections' %}
            <a href="{% url 'manage_collections' %}">
                <button class="large-button">Manage Collections</button>
            </a>
        {% endif %}
    </header>
    <div class="collections-list-content column-flex">
        {% for collection in collections %}
            {% include "partials/landing_page_collection.html" with collection=collection %}
        {% empty %}
            <p>No Collections</p>
        {% endfor %}
    </div>
</div>
