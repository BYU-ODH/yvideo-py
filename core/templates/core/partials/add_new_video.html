<dialog class="add-new-video-modal" id="add-video-dialog">
    <div class="modal">
        <div class="modal-header">
            <a class="button" href="{% url 'request_content' collection.id %}">
                + Add New Video
            </a>
        </div>

        <div class="modal-body">
            <p>Choose a library below to pick from:</p>
        </div>

        <button type="button" command="close" commandfor="add-video-dialog">Close</button>
    </div>
</dialog>
