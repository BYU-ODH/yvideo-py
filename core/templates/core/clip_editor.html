{% load static %}
{% include 'base.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Editor - {{ content.title }}</title>
    <link rel="stylesheet" href="{% static 'AnnotationPlayer.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'css/clip-editor.css' %}">
</head>
<body>
    <script>
        window.playerData = {
            events: {{ events|safe }},
            subtitles: {{ subtitles|safe }},
            clips: {{ clips|safe }},
            hasSubtitles: {{ has_subtitles|yesno:"true,false" }},
            duration: {{ duration }}
        };
    </script>

    <div class="clip-editor-container" data-content-id="{{ content.id }}" data-duration="{{ duration }}">
        <!-- Top Panel: Video Player (left) and Detail Form (right) -->
        <div class="top-panel">
            <div class="video-section">
                {% include 'partials/video-and-controls.html' %}
            </div>

            <!-- Vertical resizer between video and form -->
            <div class="resizer resizer-vertical" data-direction="horizontal"></div>

            <div class="detail-form-section">
                <div id="detail-form" class="detail-form">
                    <div class="detail-form-placeholder">
                        <p>Select a clip to edit</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Horizontal resizer between top panel and timeline -->
        <div class="resizer resizer-horizontal" data-direction="vertical"></div>

        <!-- Bottom Panel: Timeline -->
        <div class="timeline-section">
            <div class="timeline-container">
                <!-- Timeline tick marks row -->
                <div class="timeline-ticks-row">
                    <div class="timeline-ticks-label"></div>
                    <div class="timeline-ticks">
                        <div class="tick-marks-container"></div>
                    </div>
                </div>

                <!-- Layer: Clips -->
                <div class="layer" data-layer-type="clips">
                    <div class="layer-label">Clips</div>
                    <div class="layer-content">
                        <div class="layer-items">
                            {% for item in clips_with_positions %}
                                <div class="layer-item"
                                     style="left: {{ item.left }}; width: {{ item.width }};"
                                     data-item-id="{{ item.clip.id }}"
                                     data-item-type="clip"
                                     data-start="{{ item.start }}"
                                     data-end="{{ item.end }}"
                                     data-label="{{ item.clip.name }}"
                                     tabindex="0">
                                    <div class="layer-item-content">
                                        <span class="layer-item-label">{{ item.clip.name }}</span>
                                    </div>
                                </div>
                            {% endfor %}
                        </div>
                        <div class="editor-scrubber" style="--scrubber-position: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="{% static 'js/clip-editor.js' %}"></script>
</body>
</html>
