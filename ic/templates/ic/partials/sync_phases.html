{% load ic_tags %}

<ol class="ic-phases{% if failed %} ic-phases-failed{% endif %}">
    {% for step in steps %}
        <li class="{{ step.css }}">
            {% if step.css == "ic-phase-done" %}✓{% endif %}
            {{ step.label }}
            {% if downloading and step.name == phase %}
                <span class="ic-muted">{{ files_done }}/{{ files_total }} files · {{ bytes_done|filesize_gb }} of {{ bytes_total|filesize_gb }}</span>
            {% endif %}
        </li>
    {% endfor %}
</ol>
