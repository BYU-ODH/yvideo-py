{% extends "ic/manage/base.html" %}

{% block ic_content %}
    <header class="video-title">
        <h2>New program</h2>
    </header>
    <form method="post"
          action="{% url 'ic_program_new' %}"
          class="ic-manage-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="blue-button">Create program</button>
    </form>
{% endblock %}
