<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Security-Policy"
              content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' file:; connect-src 'self';">
        <meta name="description"
              content="Offline player for BYU International Cinema annotated video files.">
        <link rel="stylesheet" type="text/css" href="IC-player.css">
        <link rel="stylesheet" type="text/css" href="AnnotationPlayer.css">
        <link rel="shortcut icon" href="../resources/filmstrip.png">
        <title>BYU International Cinema - Video Player</title>
    </head>
    <body>
        <div id="splashScreen">
            <div class="container">
                <img id="logo"
                     src="../resources/ic_round.png"
                     alt="BYU International Cinema">
                <br>
                <div id="select-files-button-container">
                    <a href="#" id="play-button" onclick="player.initializeOrSelectFiles()">
                        <svg version="1.1"
                             xmlns="http://www.w3.org/2000/svg"
                             xmlns:xlink="http://www.w3.org/1999/xlink"
                             xmlns:a="http://ns.adobe.com/AdobeSVGViewerExtensions/3.0/"
                             x="0px"
                             y="0px"
                             width="100px"
                             height="100px"
                             viewBox="0 0 100 100"
                             enable-background="new 0 0 100 100"
                             xml:space="preserve">
                            <polygon class="triangle" id="XMLID_18_" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="5" points="
            36,31 75,52 36,75 " />
                        </svg>
                    </a>
                    <div id="files">Select Files</div>
                </div>
            </div>
            <br>
            <div id="file-picker-div" class="hidden">
                Select Video Files:
                <input type="file" id="filePicker" accept=".icf" multiple>
            </div>
            <div id="convert-to-ic">
                <button id="convert-to-ic-toggle"
                        onclick="document.getElementById('convert-to-ic-more').classList.toggle('hidden')">
                    Create IC file:
                </button>
                <div id="convert-to-ic-more" class="hidden">
                    Select Video file:
                    <input type="file" id="mp4FilePicker" accept=".mp4">
                    <br>
                    Select Annotations file:
                    <input type="file" id="jsonFilePicker" accept=".json">
                    <br>
                    <button id="convert-to-ic-button" onclick="player.generateICDirectory()">Create</button>
                </div>
            </div>
            <button id="toggle-annotation-mode-btn"
                    onclick="player.toggleAnnotationMode()">Annotation Mode</button>
        </div>
        <div class="main-content">
            <div class="annotation-player-container">
                <button id="return-btn" onclick="player.hidePlayer()">❮</button>
                <button id="reload-annotations-btn" onclick="player.reloadAnnotations()">Reload Annotations</button>
                <!-- The player sets the source at runtime, so this element is empty by design. -->
                <!-- djlint:off H020 -->
                <video>
                </video>
                <!-- djlint:on -->
            </div>
        </div>
        <script type="module" src="renderer.js"></script>
    </body>
</html>
