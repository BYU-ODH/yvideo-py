repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: no-commit-to-branch
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --diff, --config=pyproject.toml]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.10.12
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: django-makemigrations-check
        name: django makemigrations --check
        entry: uv run manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.6.0
    hooks:
      - id: eslint
        args: [--fix, --config=eslint.config.js]
        files: ^(?!package-lock\.json$)(?!old/)(?!node_modules/)(?!vendor/).*\.(js|mjs|json|md|css)$
        types: [file]
        additional_dependencies:
          - "@eslint/css@1.3.0"
          - "@eslint/js@10.0.1"
          - "@eslint/json@2.0.0"
          - "@eslint/markdown@8.0.2"
          - "eslint@10.6.0"
          - "globals@17.7.0"
        language_version: 20.19.5
