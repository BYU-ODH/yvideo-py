[project]
name = "yvideo-py"
version = "0.1.0"
description = "Copyright-safe course-based media sharing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django-reversion>=6.3.0,<7",
    "django>=5.2.15,<5.3",
    "gunicorn>=26.0.0,<27",
    "mozilla-django-oidc >=5.0.2,<6",
    "rapidfuzz>=3.14,<4",
    "requests>=2.34.2,<2.35",
    "xxhash>=3.8.0,<4",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "playwright==1.61.0",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "pytest-playwright==0.8.0",
    "ruff==0.15.20",
]

[tool.ruff]
exclude = ["core/migrations/*.py"]
lint.extend-select = ["I", "UP"] # Extend with isort, pydocstyle, and pyupgrade

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["yvideo", "core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yvideo.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers"
markers = [
    "e2e: browser-backed end-to-end tests",
]
