[project]
name = "yvideo-py"
version = "0.1.0"
description = "Copyright-safe course-based media sharing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django-reversion>=5.1.0",
    "django>=5.2.3",
    "onelogin==3.1.5",
    "python3-saml>=1.16.0",
    "requests>=2.32.5",
    "xxhash>=3.5.0",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "pre-commit==4.5.1",
    "ruff==0.15.7",
]

[tool.ruff]
    lint.extend-select = ["I", "UP"] # Extend with isort, pydocstyle, and pyupgrade

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["yvideo", "core"]
