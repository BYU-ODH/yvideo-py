# Per-environment config comes from .env (gitignored):
#   COMPOSE_PROJECT_NAME=yvideo-dev    # or yvideo-staging, yvideo-prod
#   HOST_PORT=8001                     # or 8002, 8003
services:
  web:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data                                        # SQLite DB + WAL/SHM journal files
      - ./media:/app/media                                      # user-uploaded media
      - ./staticfiles:/app/staticfiles                          # collectstatic output (served by Apache)
      - ./var:/app/var                                          # legacy migration snapshots
      - ./demo_media:/app/demo_media:ro                         # sample files for seed_demo_data
      - ./yvideo/secret_settings.py:/app/yvideo/secret_settings.py:ro
      - ./yvideo/saml_config:/app/yvideo/saml_config:ro
    environment:
      YVIDEO_DB_DIR: /app/data
    restart: unless-stopped
